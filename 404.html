<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found | Rainier Server</title>

<!-- Cloudflare Web Analytics -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "141eaa7b313340df8c5546f374bb0d12"}'></script>
<!-- End Cloudflare Web Analytics -->

  <style>
    body {
      font-family: "Inter", sans-serif;
      color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
      background: url('/assets/rainier-sunset.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(20, 20, 30, 0.75);
      z-index: -1;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    h1 {
      color: #00b4d8;
      font-size: 4rem;
      margin: 0;
    }

    h2 {
      color: #48cae4;
      margin-top: 0.5rem;
    }

    p {
      color: #ccc;
      margin: 1.5rem 0;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .link-btn {
      background: rgba(0, 180, 216, 0.2);
      border: 2px solid #00b4d8;
      border-radius: 10px;
      padding: 0.8rem 1.5rem;
      color: #00b4d8;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.2);
    }

    .link-btn:hover {
      background: rgba(0, 180, 216, 0.4);
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.5);
      transform: translateY(-2px);
    }

    .home-link {
      margin-top: 2rem;
      color: #00b4d8;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.2s ease;
    }

    .home-link:hover {
      color: #48cae4;
    }

    .status {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status h3 {
      color: #48cae4;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      margin: 0.5rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    
    <a class="home-link" href="/">← Back to Home</a>

    <div class="status">
      <h3>Server Status</h3>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Rainier Server: Online</span>
      </div>
      <p style="font-size: 0.9rem; margin-top: 1.5rem;">If Rainier goes offline, find me here:</p>
    </div>

    <div class="links">
      <a class="link-btn" href="https://github.com/fmorrisey" target="_blank" rel="noopener">
        GitHub
      </a>
      <a class="link-btn" href="https://www.linkedin.com/in/forrestmorrisey/" target="_blank" rel="noopener">
        LinkedIn
      </a>
      <a class="link-btn" href="https://www.forrestmorrisey.com/" target="_blank" rel="noopener">
        Portfolio
      </a>
    </div>
  </div>
</body>

</html>
